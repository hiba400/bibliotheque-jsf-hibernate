<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewAction action="#{authBean.checkUserAccess}" />
</f:metadata>
<h:head>
    <title>Mes demandes</title>
</h:head>
<h:body>
    <h2>Mes demandes d'emprunt</h2>

    <h:dataTable value="#{empruntBean.mesEmprunts}" var="e" border="1">
        <h:column>
            <f:facet name="header">Livre</f:facet>
            #{e.livre.titre}
        </h:column>
        <h:column>
            <f:facet name="header">Date demande</f:facet>
            #{e.dateDemande}
        </h:column>
        <h:column>
            <f:facet name="header">Statut</f:facet>
            #{e.statut}
        </h:column>
    </h:dataTable>

    <br/>
    <h:link outcome="/user/dashboard.xhtml" value="Retour" />
</h:body>
</html>
