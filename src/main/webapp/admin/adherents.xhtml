<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewAction action="#{authBean.checkAdminAccess}" />
    <f:viewAction action="#{utilisateurBean.chargerUtilisateurs}" />
</f:metadata>
<h:head>
    <title>Adhérents</title>
</h:head>
<h:body>
    <h2>Liste des utilisateurs</h2>

    <h:form>
        <h:commandButton value="Ajouter un utilisateur" action="#{utilisateurBean.nouveau}" />
    </h:form>

    <h:form>
        <h:dataTable value="#{utilisateurBean.utilisateurs}" var="u" border="1">
            <h:column>
                <f:facet name="header">Nom</f:facet>
                #{u.nom}
            </h:column>
            <h:column>
                <f:facet name="header">Email</f:facet>
                #{u.email}
            </h:column>
            <h:column>
                <f:facet name="header">Rôle</f:facet>
                #{u.role}
            </h:column>
            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:commandButton value="Modifier" action="#{utilisateurBean.edit(u)}" />
                <h:commandButton value="Supprimer" action="#{utilisateurBean.delete(u)}" />
            </h:column>
        </h:dataTable>
    </h:form>

    <br/>
    <h:link outcome="/admin/dashboard.xhtml" value="Retour" />
</h:body>
</html>
