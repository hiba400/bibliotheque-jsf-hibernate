<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewAction action="#{authBean.checkAdminAccess}" />
</f:metadata>
<h:head>
    <title>Form Livre</title>
</h:head>
<h:body>
    <h2>Formulaire Livre</h2>

    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel value="Titre :" />
            <h:inputText value="#{livreBean.livre.titre}" required="true" />

            <h:outputLabel value="Auteur :" />
            <h:inputText value="#{livreBean.livre.auteur}" required="true" />

            <h:outputLabel value="Catégorie :" />
            <h:inputText value="#{livreBean.livre.categorie}" required="true" />

            <h:outputLabel value="Disponible :" />
            <h:selectBooleanCheckbox value="#{livreBean.livre.disponible}" />

            <h:outputText value="" />
            <h:commandButton value="Enregistrer" action="#{livreBean.save}" />
        </h:panelGrid>
    </h:form>

    <br/>
    <h:link outcome="/admin/livres.xhtml" value="Retour" />
</h:body>
</html>
