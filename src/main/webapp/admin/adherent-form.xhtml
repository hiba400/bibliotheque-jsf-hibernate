<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">#{empty utilisateurBean.utilisateur.id ? 'Nouvel' : 'Modifier'} Adhérent - Bibliothèque</ui:define>
    <ui:define name="header">Formulaire Adhérent</ui:define>
    <ui:define name="breadcrumb">#{empty utilisateurBean.utilisateur.id ? 'Nouveau' : 'Édition'}</ui:define>

    <ui:define name="content">
        <div style="display: flex; justify-content: center; padding-top: 1rem;">
            <div class="card animate-fade" style="width: 100%; max-width: 600px; padding: 2.5rem;">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div style="width: 60px; height: 60px; background: var(--secondary-gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: white; font-size: 1.5rem;">
                        <i class="fa-solid #{empty utilisateurBean.utilisateur.id ? 'fa-user-plus' : 'fa-user-gear'}"></i>
                    </div>
                    <h2 style="font-size: 1.6rem; color: #1a202c; font-weight: 700;">
                        #{empty utilisateurBean.utilisateur.id ? 'Nouvel Adhérent' : 'Modifier Profile'}
                    </h2>
                </div>

                <h:form id="adherentForm">
                    <div class="form-group">
                        <h:outputLabel value="Nom complet" styleClass="form-label" for="nom" />
                        <h:inputText id="nom" value="#{utilisateurBean.utilisateur.nom}" 
                                     styleClass="form-control" required="true" 
                                     requiredMessage="Le nom est obligatoire" />
                        <h:message for="nom" style="color: #e53e3e; font-size: 0.8rem;" />
                    </div>

                    <div class="form-group">
                        <h:outputLabel value="Email" styleClass="form-label" for="email" />
                        <h:inputText id="email" value="#{utilisateurBean.utilisateur.email}" 
                                     styleClass="form-control" required="true"
                                     requiredMessage="L'email est obligatoire" />
                        <h:message for="email" style="color: #e53e3e; font-size: 0.8rem;" />
                    </div>

                    <div class="form-group" style="#{empty utilisateurBean.utilisateur.id ? '' : 'display:none;'}">
                        <h:outputLabel value="Mot de passe" styleClass="form-label" for="password" />
                        <h:inputSecret id="password" value="#{utilisateurBean.plainPassword}" 
                                       styleClass="form-control"
                                       required="#{empty utilisateurBean.utilisateur.id}"
                                       requiredMessage="Le mot de passe est obligatoire" />
                        <h:message for="password" style="color: #e53e3e; font-size: 0.8rem;" />
                    </div>

                    <div class="form-group">
                        <h:outputLabel value="Rôle" styleClass="form-label" for="role" />
                        <h:selectOneMenu id="role" value="#{utilisateurBean.utilisateur.role}" styleClass="form-control">
                            <f:selectItem itemValue="ADHERENT" itemLabel="Adhérent" />
                            <f:selectItem itemValue="ADMIN" itemLabel="Administrateur" />
                        </h:selectOneMenu>
                    </div>

                    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                        <h:commandLink action="#{utilisateurBean.save}" styleClass="btn btn-primary" style="flex: 2; justify-content: center;">
                            <i class="fa-solid fa-save"></i> Enregistrer
                        </h:commandLink>
                        <h:link outcome="/admin/adherents.xhtml" styleClass="btn btn-secondary" style="flex: 1; justify-content: center;">
                            Annuler
                        </h:link>
                    </div>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
