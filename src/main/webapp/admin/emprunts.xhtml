<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewAction action="#{authBean.checkAdminAccess}" />
    <f:viewAction action="#{empruntBean.chargerTout}" />
</f:metadata>
<h:head>
    <title>Emprunts</title>
</h:head>
<h:body>
    <h2>Gestion des emprunts</h2>

    <h:form>
        <h:dataTable value="#{empruntBean.emprunts}" var="e" border="1">
            <h:column>
                <f:facet name="header">Livre</f:facet>
                #{e.livre.titre}
            </h:column>
            <h:column>
                <f:facet name="header">Utilisateur</f:facet>
                #{e.utilisateur.nom}
            </h:column>
            <h:column>
                <f:facet name="header">Statut</f:facet>
                #{e.statut}
            </h:column>
            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:commandButton value="Valider" action="#{empruntBean.valider(e)}" />
                <h:commandButton value="Refuser" action="#{empruntBean.refuser(e)}" />
                <h:commandButton value="Retourner" action="#{empruntBean.retourner(e)}" />
            </h:column>
        </h:dataTable>
    </h:form>

    <br/>
    <h:link outcome="/admin/dashboard.xhtml" value="Retour" />
</h:body>
</html>
