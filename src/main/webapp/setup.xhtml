<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
      
<head>
    <title>Création Utilisateurs de Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: #28a745; color: white; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .button { background: #007bff; color: white; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        .button:hover { background: #0056b3; }
        .message { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Création des Utilisateurs de Test</h1>
        </div>
        
        <h:form>
            <h:commandButton value="Créer les utilisateurs de test" 
                             action="#{testDataCreator.createTestUsers()}"
                             styleClass="button" />
        </h:form>
        
        <h:messages styleClass="message" />
        
        <div style="margin-top: 20px;">
            <h3>📋 Identifiants de test :</h3>
            <p><strong>Administrateur :</strong> admin@biblio.com / admin123</p>
            <p><strong>Utilisateur :</strong> user@biblio.com / user123</p>
        </div>
        
        <div style="margin-top: 20px;">
            <a href="login.xhtml" style="color: #007bff; text-decoration: none;">
                ← Retour à la connexion
            </a>
        </div>
    </div>
</body>
</html>
