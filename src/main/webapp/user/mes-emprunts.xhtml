<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <f:metadata>
        <f:viewAction action="#{authBean.checkUserAccess}" />
    </f:metadata>

    <ui:define name="title">Mes Emprunts - Bibliothèque</ui:define>
    <ui:define name="header">Mon Historique d'Emprunts</ui:define>
    <ui:define name="breadcrumb">Mes Emprunts</ui:define>

    <ui:define name="content">
        <div class="card animate-fade">
            <div class="card-header">
                <h3 style="font-weight: 600; color: #2d3748;">Liste de mes emprunts</h3>
            </div>

            <div class="table-container">
                <h:dataTable value="#{empruntBean.mesEmprunts}" var="e"
                             styleClass="premium-table"
                             rendered="#{not empty empruntBean.mesEmprunts}">
                    
                    <h:column>
                        <f:facet name="header">Livre</f:facet>
                        <div style="font-weight: 600;">#{e.livre.titre}</div>
                        <div style="font-size: 0.8rem; color: #718096;">#{e.livre.auteur}</div>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Date Emprunt</f:facet>
                        <h:outputText value="#{e.dateValidation}">
                            <f:convertDateTime pattern="dd/MM/yyyy" />
                        </h:outputText>
                        <h:outputText value="-" rendered="#{empty e.dateValidation}" />
                    </h:column>

                    <h:column>
                        <f:facet name="header">Date Retour</f:facet>
                        <h:outputText value="#{e.dateRetour}">
                            <f:convertDateTime pattern="dd/MM/yyyy" />
                        </h:outputText>
                        <h:outputText value="En cours" rendered="#{empty e.dateRetour and e.statut == 'VALIDE'}" styleClass="badge badge-info" />
                        <h:outputText value="-" rendered="#{empty e.dateRetour and e.statut != 'VALIDE'}" />
                    </h:column>

                    <h:column>
                        <f:facet name="header">Statut</f:facet>
                        <span class="badge #{e.statut == 'VALIDE' ? 'badge-success' : (e.statut == 'RETOURNE' ? 'badge-info' : (e.statut == 'REFUSE' ? 'badge-danger' : 'badge-warning'))}">
                            #{e.statut}
                        </span>
                    </h:column>
                </h:dataTable>

                <h:panelGroup rendered="#{empty empruntBean.mesEmprunts}">
                    <div style="text-align: center; padding: 4rem 1rem;">
                        <i class="fa-solid fa-book-open" style="font-size: 3rem; color: #e2e8f0; margin-bottom: 1.5rem;"></i>
                        <h3 style="color: #4a5568;">Vous n'avez pas encore d'emprunts</h3>
                        <p style="color: #718096; margin-top: 1rem;">Explorez le catalogue pour trouver votre prochaine lecture !</p>
                        <h:link outcome="/user/catalogue.xhtml" styleClass="btn btn-primary" style="margin-top: 1.5rem;">
                            Voir le catalogue
                        </h:link>
                    </div>
                </h:panelGroup>
            </div>
        </div>
    </ui:define>
</ui:composition>
