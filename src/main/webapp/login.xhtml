<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: #4facfe;
            box-shadow: 0 0 5px rgba(79,172,254,0.5);
        }

        .btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #4facfe;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #007bff;
        }

        .label {
            float: left;
            font-size: 14px;
            color: #555;
        }
    </style>

</h:head>

<h:body>

    <div class="login-container">
        <h2>Connexion</h2>

        <h:form>

            <div class="label">Email</div>
            <h:inputText value="#{authBean.email}" styleClass="input-field"/>

            <div class="label">Mot de passe</div>
            <h:inputSecret value="#{authBean.password}" styleClass="input-field"/>

            <h:commandButton value="Se connecter"
                             action="#{authBean.login}"
                             styleClass="btn"/>

        </h:form>
    </div>

</h:body>
</html>
